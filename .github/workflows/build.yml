name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.0) - used only for a manual test build, no release is published"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine version
        id: version
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ($env:RELEASE_REF_TYPE -eq "tag") {
            $raw = $env:RELEASE_REF_NAME
            $version = $raw -replace '^v', ''
          } else {
            $version = $env:RELEASE_INPUT_VERSION
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Expected a semantic version, received: $version"
          }
          $numericVersion = ($version -split '-', 2)[0]
          echo "file_version=$numericVersion.0" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version"

      - name: Restore
        run: dotnet restore src/PdfToImages.sln

      - name: Run conversion integration tests on Windows
        run: dotnet test tests/PdfToImages.Tests/PdfToImages.Tests.csproj -c Release

      - name: Publish single-file executable
        run: >
          dotnet publish src/PdfToImages/PdfToImages.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.file_version }}
          -o publish

      - name: Verify the executable exists and is a valid PE file
        shell: pwsh
        run: |
          $exe = "publish/PdfToImages.exe"
          if (-not (Test-Path $exe)) {
            throw "Build failed: $exe was not produced."
          }
          $size = (Get-Item $exe).Length
          Write-Host "Executable size: $size bytes"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a -or
              [BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550) {
            throw "Build did not produce a valid Windows PE executable."
          }
          if ($size -lt 1MB) {
            throw "Build looks suspicious: executable is unexpectedly small ($size bytes)."
          }

      - name: Exercise WPF output mode selection
        shell: pwsh
        run: ./tests/Smoke-Windows.ps1

      - name: Rename output for release
        shell: pwsh
        run: |
          Copy-Item "publish/PdfToImages.exe" "publish/PDFtoIMG.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFtoIMG-${{ steps.version.outputs.version }}
          path: publish/PDFtoIMG.exe
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: publish/PDFtoIMG.exe
          name: "PDFtoIMG — תמונות ו־Word ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
