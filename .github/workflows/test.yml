name: Conversion tests

on:
  push:
    branches: [main, feature/pdf-to-docx]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversion-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test website release download selection
        run: node --test tests/release-fetcher.test.cjs
      - name: Restore
        run: dotnet restore tests/PdfToImages.Tests/PdfToImages.Tests.csproj
      - name: Test real PDF rendering and DOCX structure
        env:
          PDFTOIMG_TEST_ARTIFACTS: ${{ runner.temp }}/docx-fixtures
        run: dotnet test tests/PdfToImages.Tests/PdfToImages.Tests.csproj -c Release --no-restore
      - name: Build WPF application
        run: dotnet build src/PdfToImages.sln -c Release -p:EnableWindowsTargeting=true
      - name: Publish self-contained Windows executable
        if: runner.os == 'Windows'
        run: dotnet publish src/PdfToImages/PdfToImages.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Exercise WPF output mode selection
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Smoke-Windows.ps1
      - name: Install independent layout validation tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          python -m pip install -r tests/layout-requirements.txt
      - name: Verify actual DOCX pagination and page appearance
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/docx-layout"
          libreoffice -env:UserInstallation=file://"$RUNNER_TEMP/lo-profile" --headless --convert-to pdf --outdir "$RUNNER_TEMP/docx-layout" "$RUNNER_TEMP"/docx-fixtures/*.docx
          python tests/validate_docx_layout.py "$RUNNER_TEMP/docx-fixtures" "$RUNNER_TEMP/docx-layout"
